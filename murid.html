<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ruang Fikir Sejarah | Murid</title>
<style>
:root{font-family:system-ui,Arial;color:#271943;background:#f6f2ff}
*{box-sizing:border-box}body{margin:0}
header{background:linear-gradient(110deg,#45217b,#8e60d6);color:#fff;padding:24px 6%}
main{max-width:850px;margin:auto;padding:18px}
.card{background:#fff;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 4px 18px #49307715}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
label{display:block;font-weight:700;margin:12px 0 6px}
input,select,textarea,button{font:inherit}
input,select,textarea{width:100%;padding:12px;border:1px solid #cfc1e9;border-radius:12px;background:#fff}
textarea{min-height:180px;resize:vertical}
button{border:0;border-radius:12px;padding:12px 18px;background:#6b3bb0;color:#fff;font-weight:700;cursor:pointer}
button:disabled{opacity:.55;cursor:not-allowed}
.q{display:block;width:100%;text-align:left;background:#f2eaff;color:#2a174c;border:2px solid #dfd0f5;margin:9px 0;line-height:1.5;white-space:normal}
.q.active{border-color:#683ca9;background:#e6dcfa}
.muted{color:#6f6382}.ok{background:#eaf8ee;color:#185b2a;padding:12px;border-radius:12px}.warn{background:#fff3dc;color:#7a4b00;padding:12px;border-radius:12px}
</style>
</head>
<body>
<header>
<h1>✦ Ruang Fikir Sejarah</h1>
<p>HistoryVerse 360 · Jawab sekali · Hantar sekali</p>
</header>
<main>
<div class="card">
<h2>✍️ Latihan Murid</h2>
<p class="muted">Pilih soalan, taip jawapan dan tekan <b>Hantar jawapan</b> sekali sahaja.</p>
<div class="grid">
<div><label for="level">Tingkatan</label><select id="level"><option value="2">Tingkatan 2</option><option value="1">Tingkatan 1</option></select></div>
<div><label for="kelas">Kelas</label><select id="kelas"></select></div>
</div>
<label>Pilih soalan</label>
<div id="questions" role="group" aria-label="Soalan terbitan guru"></div>
<button id="reload" type="button">Muat semula soalan</button>
<p id="selected" class="muted">Belum pilih soalan.</p>
<label for="nama">Nama panggilan</label>
<input id="nama" maxlength="50" autocomplete="off" placeholder="Contoh: Ida">
<label for="jawapan">Jawapan</label>
<textarea id="jawapan" maxlength="15000" placeholder="Taip jawapan di sini..."></textarea>
<button id="send" disabled>Hantar jawapan</button>
<button id="check" type="button" hidden>Semak status hantaran</button>
<p id="state" role="status" aria-live="polite"></p>
</div>
<div class="card">
<h3>Selepas hantar</h3>
<p class="muted">Tunggu guru menyemak. Jawapan yang guru terbitkan akan muncul dalam Galeri Jawapan pada portal utama.</p>
</div>
</main>
<script src="api-config.js"></script>
<script>
(()=>{
'use strict';
const API=window.RUANG_FIKIR_API_URL;
const $=id=>document.getElementById(id);
const classes=['1 Adil','1 Gigih','1 Cendekia','1 Bestari','1 Yakin','1 Tekun','1 Usaha','2 Adil','2 Bestari','2 Cendekia','2 Dedikasi','2 Ehsan','2 Gigih','2 Harmoni','2 Kreatif','2 Murni','2 Progresif','2 Rasional','2 Tekun','2 Yakin'];
let questions=[],selected=null,busy=false,ready=false,questionState='loading';
const status=(message,kind='muted')=>{$('state').textContent=message;$('state').className=kind};
async function read(action,params={}){
 // Public reads must not depend on which Google account is signed in.
 const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),12000);
 try{
  const result=await fetch(API+'?'+new URLSearchParams({action,...params,_:String(Date.now())}),{mode:'cors',credentials:'omit',redirect:'follow',referrerPolicy:'no-referrer',signal:controller.signal});
  if(!result.ok)throw Error('HTTP '+result.status);
  const body=await result.json();
  if(!body||typeof body.success!=='boolean')throw Error('Respons tidak sah.');
  return body;
 }catch(error){return readJsonp(action,params)}finally{clearTimeout(timeout)}
}
function readJsonp(action,params={}){
 return new Promise((resolve,reject)=>{
  const cb='rfStudent_'+crypto.randomUUID().replaceAll('-','');
  const el=document.createElement('script');el.referrerPolicy='no-referrer';let done=false;
  const finish=(error,data)=>{if(done)return;done=true;clearTimeout(timer);el.remove();delete window[cb];error?reject(error):resolve(data)};
  const timer=setTimeout(()=>finish(Error('Sambungan mengambil masa terlalu lama.')),15000);
  window[cb]=data=>finish(null,data);el.onerror=()=>finish(Error('Sambungan Google Sheets tidak dapat dibaca.'));
  el.src=API+'?'+new URLSearchParams({action,...params,callback:cb,_:String(Date.now())});document.head.append(el);
 });
}
function key(){return 'rf-student-v1:'+JSON.stringify([selected?.id,$('kelas').value,$('nama').value.trim().toLocaleLowerCase()])}
function record(){const raw=localStorage.getItem(key());return raw?JSON.parse(raw):null}
function lock(value){busy=value;['level','kelas','nama','jawapan','reload'].forEach(id=>$(id).disabled=value);document.querySelectorAll('.q').forEach(el=>el.disabled=value);$('send').disabled=value||!ready||!selected;$('check').disabled=value}
function refreshState(){
 if(busy)return;
 $('check').hidden=true;$('send').disabled=!ready||!selected;
 try{
  const saved=record();
  if(saved){$('send').disabled=true;if(saved.status==='confirmed')status('✓ Jawapan ini sudah disimpan. ID: '+saved.id,'ok');else{status('Hantaran ini belum disahkan. Tekan Semak status hantaran; jangan hantar semula.','warn');$('check').hidden=false}}
  else status(ready?'Pilih soalan, isi nama dan jawapan.':questionState==='error'?'Soalan belum dapat dimuatkan. Tekan Muat semula soalan.':'Memuatkan soalan terbitan guru…',questionState==='error'?'warn':'muted');
 }catch(e){$('send').disabled=true;status('Benarkan storan pelayar untuk mengelakkan hantaran berulang.','warn')}
}
function renderQuestions(){
 selected=null;$('selected').textContent='Belum pilih soalan.';$('questions').replaceChildren();
 const list=questions.filter(q=>String(q.level)===$('level').value);
 list.forEach(q=>{const b=document.createElement('button');b.type='button';b.className='q';b.setAttribute('aria-pressed','false');b.textContent='Bab '+q.topic+' · '+q.kind+' · '+q.max+' markah — '+q.q;b.onclick=()=>{if(busy)return;selected=q;document.querySelectorAll('.q').forEach(x=>{x.classList.remove('active');x.setAttribute('aria-pressed','false')});b.classList.add('active');b.setAttribute('aria-pressed','true');$('selected').textContent='Dipilih: '+q.q;refreshState()};$('questions').append(b)});
 if(!list.length)$('questions').textContent=questionState==='loaded'?'Belum ada soalan diterbitkan bagi tingkatan ini.':questionState==='error'?'Sambungan gagal. Senarai soalan belum dapat dibaca.':'Memuatkan soalan terbitan guru…';
 refreshState();
}
function refreshClasses(){
 $('kelas').replaceChildren();classes.filter(c=>c.startsWith($('level').value+' ')).forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;$('kelas').append(o)});renderQuestions();
}
async function loadQuestions(){
 ready=false;questionState='loading';questions=[];lock(true);renderQuestions();status('Memuatkan soalan terbitan guru…');
 try{
  const [health,body]=await Promise.all([read('health'),read('questions')]);
  if(!health?.success||Number.parseFloat(health.version)<15)throw Error('Sambungan penghantaran belum tersedia. Maklumkan kepada guru.');
  if(!body?.success||!Array.isArray(body.data))throw Error(body?.error||'Soalan belum dapat dibaca.');
  questions=body.data;ready=true;questionState='loaded';renderQuestions();
 }catch(e){questions=[];questionState='error';renderQuestions();status(e.message+' Tekan Muat semula soalan.','warn')}
 finally{lock(false);if(ready)refreshState()}
}
async function confirmReceipt(storageKey,saved){
 for(let i=0;i<12;i++){
  await new Promise(resolve=>setTimeout(resolve,1500));
  let body;try{body=await read('receipt',{requestId:saved.requestId})}catch(e){continue}
  if(!body?.success||!body.ready)continue;
  const result=body.result;
  if(result?.success===false){localStorage.removeItem(storageKey);throw Error(result.error||'Pelayan menolak hantaran. Jawapan belum disimpan.')}
  if(!result?.success||!result.id||!result.receipt)continue;
  localStorage.setItem(storageKey,JSON.stringify({...saved,status:'confirmed',id:result.id,receipt:result.receipt}));
  status('✓ Jawapan disahkan disimpan dalam Google Sheets. ID: '+result.id+'. Tunggu semakan guru.','ok');
  $('check').hidden=true;$('jawapan').value='';return;
 }
 throw Error('Pengesahan belum diterima. Jawapan mungkin telah disimpan. Semak status atau maklumkan kepada guru; jangan hantar semula.');
}
$('send').onclick=async()=>{
 if(busy||!ready||!selected)return;
 const name=$('nama').value.trim(),answer=$('jawapan').value.trim(),cls=$('kelas').value;
 if(!name||!answer||!cls){status('Lengkapkan kelas, nama dan jawapan dahulu.','warn');return}
 let storageKey,saved;
 try{storageKey=key();if(record()){refreshState();return}saved={status:'pending',requestId:crypto.randomUUID(),created:new Date().toISOString()};localStorage.setItem(storageKey,JSON.stringify(saved))}catch(e){status('Benarkan storan pelayar sebelum menghantar. Jawapan belum dihantar.','warn');return}
 lock(true);status('Menghantar sekali dan menunggu pengesahan…');
 try{
  // Exactly one POST. An opaque response is not proof of a saved answer.
  // Receipt reads never repeat the write, even after an uncertain network error.
  const payload={action:'submitAnswer',questionId:selected.id,name,cls,answer,requestId:saved.requestId};
  const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),20000);
  try{await fetch(API,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},body:new URLSearchParams({payload:JSON.stringify(payload)}),signal:controller.signal})}catch(e){}finally{clearTimeout(timer)}
  await confirmReceipt(storageKey,saved);
 }catch(e){status(e.message,'warn')}
 finally{lock(false);try{const current=record();$('send').disabled=!!current;$('check').hidden=!current||current.status==='confirmed'}catch(e){$('send').disabled=true}}
};
$('check').onclick=async()=>{
 if(busy)return;let saved,storageKey;try{saved=record();storageKey=key()}catch(e){status('Storan pelayar tidak dapat dibaca.','warn');return}if(!saved||saved.status==='confirmed')return;
 lock(true);status('Menyemak pengesahan tanpa menghantar semula…');
 try{await confirmReceipt(storageKey,saved)}catch(e){status(e.message,'warn')}finally{lock(false);try{const current=record();$('send').disabled=!!current;$('check').hidden=!current||current.status==='confirmed'}catch(e){$('send').disabled=true}}
};
$('level').onchange=refreshClasses;$('kelas').onchange=refreshState;$('nama').oninput=refreshState;$('reload').onclick=loadQuestions;
refreshClasses();loadQuestions();
})();

</script>
</body>
</html>
